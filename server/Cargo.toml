[package]
name = "opentempus"
description = "Self-hostable calendar synchronization and selective sharing platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "opentempus"

[[bin]]
name = "opentempus"
path = "src/main.rs"

[dependencies]
# web
axum = { version = "0.8", features = ["macros", "json", "query"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "set-header"] }
tokio = { version = "1", features = ["full"] }
hyper = "1"

# db
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ids / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
rrule = "0.14"

# calendar formats
ical = "0.11"

# auth / crypto
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# http client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }

# misc
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
futures = "0.3"
async-trait = "0.1"
regex = "1"
url = "2"
time = "0.3"

[dev-dependencies]
pretty_assertions = "1"
