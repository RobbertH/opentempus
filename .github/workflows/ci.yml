name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

  docker:
    name: Docker image (build, publish on main)
    runs-on: ubuntu-latest
    needs: [server, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests only prove the image builds; main publishes it.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/robberth/opentempus:latest
            ghcr.io/robberth/opentempus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
